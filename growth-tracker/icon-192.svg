<svg width="192" height="192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#grad1)"/>

  <!-- Growth Symbol - Rising Arrow with Layers -->
  <g transform="translate(96, 96)">
    <!-- Base Circle -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="white" stroke-width="4" opacity="0.3"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="white" stroke-width="4" opacity="0.5"/>

    <!-- Central Arrow -->
    <path d="M 0,-35 L 15,-15 L 6,-15 L 6,35 L -6,35 L -6,-15 L -15,-15 Z"
          fill="white" stroke="none"/>

    <!-- Growth Bars -->
    <rect x="-35" y="10" width="8" height="25" fill="white" opacity="0.7" rx="2"/>
    <rect x="-20" y="0" width="8" height="35" fill="white" opacity="0.8" rx="2"/>
    <rect x="12" y="5" width="8" height="30" fill="white" opacity="0.7" rx="2"/>
    <rect x="27" y="-5" width="8" height="40" fill="white" opacity="0.8" rx="2"/>
  </g>

  <!-- Text -->
  <text x="96" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="bold"
        text-anchor="middle" fill="white" opacity="0.9">GROWTH</text>
</svg>
