<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#grad1)"/>

  <!-- Growth Symbol - Rising Arrow with Layers -->
  <g transform="translate(256, 256)">
    <!-- Base Circles -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="white" stroke-width="10" opacity="0.3"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="white" stroke-width="10" opacity="0.5"/>

    <!-- Central Arrow -->
    <path d="M 0,-95 L 40,-40 L 16,-40 L 16,95 L -16,95 L -16,-40 L -40,-40 Z"
          fill="white" stroke="none"/>

    <!-- Growth Bars -->
    <rect x="-95" y="25" width="20" height="70" fill="white" opacity="0.7" rx="5"/>
    <rect x="-55" y="0" width="20" height="95" fill="white" opacity="0.8" rx="5"/>
    <rect x="35" y="15" width="20" height="80" fill="white" opacity="0.7" rx="5"/>
    <rect x="75" y="-15" width="20" height="110" fill="white" opacity="0.8" rx="5"/>
  </g>

  <!-- Text -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        text-anchor="middle" fill="white" opacity="0.9">GROWTH</text>
</svg>
